     <!-- CURSOR BALL SCRIPT -->
    <style>
      @media (hover: hover) and (pointer: fine) {
        body { cursor: default; }
        .zyrez-cursor-ball {
          position: fixed;
          top: 0;
          left: 0;
          width: 24px;
          height: 24px;
          background: radial-gradient(circle, rgba(255,204,0,0.85) 0%, rgba(255,204,0,0.2) 70%, transparent 100%);
          border: 1.5px solid rgba(255, 204, 0, 0.6);
          border-radius: 50%;
          pointer-events: none;
          z-index: 999999;
          transform: translate(-50%, -50%);
          transition: width 0.3s ease, height 0.3s ease, background 0.3s ease;
          box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
          will-change: transform;
        }
        body:has(a:hover, button:hover) .zyrez-cursor-ball {
          width: 45px;
          height: 45px;
          background: radial-gradient(circle, rgba(255,204,0,0.4) 0%, rgba(255,204,0,0.1) 70%, transparent 100%);
          border-color: rgba(255, 204, 0, 0.9);
        }
      }
    </style>
    <div class="zyrez-cursor-ball" id="zyrezCursorBall"></div>
    <script>
      (function () {
        if (window.matchMedia("(pointer: coarse)").matches) return;
        const ball = document.getElementById("zyrezCursorBall");
        if (!ball) return;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let ballX = mouseX;
        let ballY = mouseY;
        let time = 0;
        window.addEventListener("mousemove", (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });
        function animate() {
          let distX = mouseX - ballX;
          let distY = mouseY - ballY;
          ballX += distX * 0.15;
          ballY += distY * 0.15;
          time += 0.05;
          let pulse = Math.sin(time) * 3;
          ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0) translate(-50%, -50%) scale(${1 + pulse * 0.02})`;
          requestAnimationFrame(animate);
        }
        animate();
      })();
    </script>
  </body>
</html>

/* Gradient animation (sample jaisi ping-pong, 6s) */

  0%   { background-position: 100% 50%; }
  50%  { background-position: 0% 50%; }

    <script>
      (function () {
        "use strict";

        /* ===== CONFIG (easy settings) ===== */
        var CONFIG = {
          waitForPreloader: true,
          fullBleed: true,
          fixedNav: false,
          lockScroll: true,
          orbitSpeed: 1,
          floatAmount: 1,
          mouseStrength: 0,
          /* MENU ITEMS: replace with your real GHL page links */
          menuItems: [
            { label: "Home", href: "#" },
            { label: "Services", href: "#services" },
            { label: "Work", href: "#work" },
            { label: "Portfolio", href: "#portfolio" },
            { label: "Blog", href: "#blog" },
            { label: "Career", href: "#career" },
            { label: "About", href: "#about" },
            { label: "Team", href: "#team" },
            { label: "Contact", href: "#contact" },
          ],
        };
        var root = document.getElementById("zyrez-hero-root");
        if (!root) return;
        var $ = function (s) {
          return root.querySelector(s);
        };
        root.classList.add("zyrez-hero-js");

        /* ---- Full-bleed: break out of the GHL column without causing sideways scroll ---- */
        function bleed() {
          if (!CONFIG.fullBleed) return;
          root.style.width = "100%";
          root.style.marginLeft = "0";
          var left = root.getBoundingClientRect().left;
          root.style.width = document.documentElement.clientWidth + "px";
          root.style.marginLeft = -left + "px";
        }

        /* ---- Navbar + menu ---- */
        if (CONFIG.fixedNav) $(".zyrez-nav").classList.add("zyrez-nav--fixed");
        var logoImg = $(".zyrez-nav-logo img");
        logoImg.addEventListener("error", function () {
          logoImg.style.display = "none";
        });

        var btn = $(".zyrez-nav-btn"),
          menu = $(".zyrez-menu"),
          list = $(".zyrez-menu-list");
        CONFIG.menuItems.forEach(function (it, i) {
          var li = document.createElement("li"),
            a = document.createElement("a"),
            n = document.createElement("small");
          li.className = "zyrez-menu-item";
          li.style.setProperty("--i", i);
          a.className = "zyrez-menu-link";
          a.href = it.href;
          n.textContent = (i < 9 ? "0" : "") + (i + 1);
          a.appendChild(n);
          a.appendChild(document.createTextNode(it.label));
          li.appendChild(a);
          list.appendChild(li);
        });
        function setMenu(open) {
          var r = btn.getBoundingClientRect(); // the menu "opens" from the button
          root.style.setProperty("--zyrez-mx", r.left + r.width / 2 + "px");
          root.style.setProperty("--zyrez-my", r.top + r.height / 2 + "px");
          root.classList.toggle("zyrez-menu-open", open);
          btn.setAttribute("aria-expanded", open);
          menu.setAttribute("aria-hidden", !open);
          if (CONFIG.lockScroll)
            document.documentElement.style.overflow = open ? "hidden" : "";
        }
        btn.addEventListener("click", function () {
          setMenu(!root.classList.contains("zyrez-menu-open"));
        });
        list.addEventListener("click", function (e) {
          if (e.target.closest("a")) setMenu(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setMenu(false);
        });

        /* ---- Hero image placeholder: hide it once a real image loads ---- */
        var img = $(".zyrez-hero-img");
        function hasImg() {
          root.classList.add("zyrez-has-img");
        }
        if (img.getAttribute("src")) {
          if (img.complete && img.naturalWidth) hasImg();
          else img.addEventListener("load", hasImg);
        }

        /* ---- Orbit system ---- */
        var stage = $(".zyrez-hero-stage"),
          visual = $(".zyrez-hero-visual"),
          giant = $(".zyrez-hero-giant");
        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        var fine = window.matchMedia(
          "(hover:hover) and (pointer:fine)",
        ).matches;
        var cards = [].slice
          .call(root.querySelectorAll(".zyrez-hero-card"))
          .map(function (el) {
            var d = el.dataset;
            return {
              el: el,
              rx: +d.rx || 0.4,
              ry: +d.ry || 0.25,
              sp: +d.speed || 8,
              ph: +d.phase || 0,
              dp: +d.depth || 0.5,
              fl: +d.float || 8,
              rt: +d.rot || 4,
              min: +d.min || 0,
              w: 0,
              on: true,
            };
          });
        var W = 0,
          H = 0,
          VW = 0,
          T = 0,
          last = 0,
          mx = 0,
          my = 0,
          tx = 0,
          ty = 0,
          run = false,
          vis = true;

        function measure() {
          var r = stage.getBoundingClientRect();
          W = r.width;
          H = r.height;
          VW = document.documentElement.clientWidth;
          cards.forEach(function (c) {
            c.on = VW >= c.min;
            c.el.style.display = c.on ? "" : "none";
            c.w = c.on ? c.el.offsetWidth : 0;
          });
        }
        function frame(now) {
          var dt = last ? (now - last) / 1000 : 0;
          last = now;
          T += Math.min(dt, 0.05);
          mx += (tx - mx) * 0.06;
          my += (ty - my) * 0.06;
          cards.forEach(function (c) {
            if (!c.on) return;
            var a = ((c.ph + T * c.sp * CONFIG.orbitSpeed) * Math.PI) / 180,
              s = Math.sin(a),
              co = Math.cos(a);
            var half = Math.max(40, VW / 2 - c.w / 2 - 10); // keep cards inside the screen
            var x = co * Math.min(c.rx * W, half);
            var y =
              s * c.ry * H +
              Math.sin(T * 0.9 + c.ph) * c.fl * CONFIG.floatAmount;
            var k = fine ? CONFIG.mouseStrength * c.dp * 22 : 0;
            var rot = Math.sin(T * 0.6 + c.ph) * c.rt + co * 3;
            c.el.style.transform =
              "translate3d(" +
              (x + mx * k) +
              "px," +
              (y + my * k) +
              "px,0) translate(-50%,-50%) rotate(" +
              rot +
              "deg) scale(" +
              (1 + s * 0.1) +
              ")";
            c.el.style.zIndex = s > 0 ? 5 : 2; // top half passes behind the person
          });
          if (fine && CONFIG.mouseStrength) {
            visual.style.transform =
              "translate3d(" + -mx * 10 + "px," + -my * 6 + "px,0)";
            giant.style.transform = "translate3d(" + mx * 14 + "px,0,0)";
          }
          if (run) requestAnimationFrame(frame);
        }
        function loop() {
          var should = vis && !document.hidden && !reduce;
          if (should && !run) {
            run = true;
            last = 0;
            requestAnimationFrame(frame);
          } else if (!should) run = false;
        }
        if (fine && CONFIG.mouseStrength) {
          root.addEventListener("mousemove", function (e) {
            tx = (e.clientX / VW - 0.5) * 2;
            ty = (e.clientY / window.innerHeight - 0.5) * 2;
          });
          root.addEventListener("mouseleave", function () {
            tx = 0;
            ty = 0;
          });
        }
        if ("IntersectionObserver" in window) {
          new IntersectionObserver(function (en) {
            vis = en[0].isIntersecting;
            loop();
          }).observe(root);
        }
        document.addEventListener("visibilitychange", loop);
        window.addEventListener("resize", function () {
          bleed();
          measure();
          if (!run) frame(performance.now());
        });

        /* ---- Start (after the preloader begins leaving, if present) ---- */
        function start() {
          bleed();
          measure();
          root.classList.add("zyrez-hero-ready");
          frame(performance.now()); // draw first frame (also covers reduced-motion)
          loop();
        }
        function begin() {
          if (!CONFIG.waitForPreloader) return start();
          var n = 0,
            i = setInterval(function () {
              var p = document.getElementById("zyrez-preloader");
              if (
                !p ||
                /zp-leaving|zyrez-hide/.test(p.className) ||
                ++n > 150
              ) {
                clearInterval(i);
                setTimeout(start, 300);
              }
            }, 100);
        }
        bleed();
        if (document.readyState === "complete") begin();
        else window.addEventListener("load", begin);
        setTimeout(function () {
          if (!root.classList.contains("zyrez-hero-ready")) start();
        }, 16000); // failsafe
      })();
    </script>
